<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | White Water Rafting Company</title>
    <meta name="description"
      content="Contact White Water Rafting Company for reservations, general inquiries, or feedback on our trips.">
    <meta name="author" content="Richard Danso">
    <link rel="stylesheet" href=" styles/rafting.css">
</head>

<body>
    <header>
        <img src="images/rapids.jpg" alt="logo">
        <nav>
            <ul>
                <li><a href="index.html">Home</a> </li>
                <li><a href="about.html">About Us</a> </li>
                <li><a href="trips.html">Trips</a> </li>
                <li><a href="contact.html">Contact Us</a> </li>
            </ul>
        </nav>
    </header>
    <main>
        <div class="contact-info">
            <h2>White Water Rafting Company</h2>
            <address>
                Main River Street<br>
                Richard, California<br>
                +1 999 999 3489<br>
                <a href="mailto:info@whitewater.com">info@whitewater.com</a>
            </address>
        </div>
        <section class="contact-container">
            <div class="map-box">
                <img src="images/map.png" alt="Map Location">
            </div>

            <form class="contact-form">
                <div class="form-group">
                    <label for="name">Name</label>
                    <input type="text" id="name" placeholder="Placeholder">
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" placeholder="Placeholder">
                </div>

                <div class="radio-group">
                    <p>Message Purpose</p>
                    <label><input type="radio" name="purpose" value="general"> General
                        Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation
                        Question</label>
                    <label><input type="radio" name="purpose" value="website"> Website
                        Suggestion</label>
                </div>

                <div class="form-group">
                    <label for="message">Message</label>
                    <textarea id="message" placeholder="Type here"></textarea>
                </div>

                <div class="checkbox-group">
                    <label>
                        <input type="checkbox"> Please Subscribe me to the monthly newsletter
                    </label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>
        </section>
        <section class="team-section">
            <h2>We Are Here to Serve You</h2>

            <div class="profiles-container">
                <figure class="profile-card">
                    <img src="images/timothy-reid.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="profile-card">
                    <img src="images/timothy.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>

                <figure class="profile-card">
                    <img src="images/pavel.jpg" alt="Employee Profile">
                    <figcaption>Employee Profile</figcaption>
                </figure>
            </div>
        </section>
    </main>
    <footer>
        <p>@2026 ☄️☄️ Rafting Company Limited ☄️☄️ Richard Danso</p>

        <div class="social-links">
            <a href="#"><img src="images/Facebook.png" alt="Facebook"></a>
            <a href="#"><img src="images/Insta.png" alt="Instagram"></a>
            <a href="#"><img src="images/Linkedin.png" alt="Linkedin"></a>
        </div>
    </footer>
</body>

</html>
